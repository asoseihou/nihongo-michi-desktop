name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to a commit (the tag in the comment), so a
# moved tag upstream cannot change what runs here.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      # whisper.cpp (whisper-rs) needs CMake and libclang; both come with the runner.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Formatação
        run: cargo fmt --all -- --check

      - name: Testes (núcleo e backend)
        run: cargo test

      - name: Testes da interface
        run: cargo test -p michi-ui

      - name: Interface em wasm32
        run: cargo build -p michi-ui --target wasm32-unknown-unknown
