name: Release

on:
  push:
    tags: ["v*"]

# Writes the release; the signing key reaches only the build step. Third-party
# actions are pinned to a commit (the tag in the comment).
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown

      # No build cache here: this job receives the signing key, so it builds
      # from a clean slate (slower, nothing restored from other runs).

      - name: Trunk e tauri-cli
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: trunk@0.22.2,tauri-cli@2.12.6

      # The release text: this version's section of NOVIDADES.md, then how to
      # install. The app shows the first part after updating itself.
      - name: Notas da versão
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v t="## ${tag}" '$0==t{f=1;next} /^## /{if(f)exit} f' NOVIDADES.md > notes.md
          {
            echo 'body<<NOTES_EOF'
            cat notes.md
            echo
            echo '---'
            echo
            cat .github/release-install.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # The updater files (.sig and latest.json) are signed with the project's
      # key, kept in the repository secrets; the app only installs what it signs.
      - name: Instalador e release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: Nihongo Michi ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
