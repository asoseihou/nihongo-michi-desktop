name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Trunk e tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli@2

      # The release text: this version's section of NOVIDADES.md, then how to
      # install. The app shows the first part after updating itself.
      - name: Notas da versão
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v t="## ${tag}" '$0==t{f=1;next} /^## /{if(f)exit} f' NOVIDADES.md > notes.md
          {
            echo 'body<<NOTES_EOF'
            cat notes.md
            echo
            echo '---'
            echo
            cat .github/release-install.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # The updater files (.sig and latest.json) are signed with the project's
      # key, kept in the repository secrets; the app only installs what it signs.
      - name: Instalador e release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: Nihongo Michi ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
