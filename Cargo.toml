[workspace]
resolver = "2"
members = ["crates/michi-core", "src-tauri", "ui"]
# `cargo build` / `cargo test` at the root only touch the native crates;
# the Leptos UI is built for wasm32 by Trunk.
default-members = ["crates/michi-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["asoseihou"]
license = "MIT"
repository = "https://github.com/asoseihou/nihongo-michi-desktop"
rust-version = "1.85"

[workspace.dependencies]
michi-core = { path = "crates/michi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde", "wasmbind"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
